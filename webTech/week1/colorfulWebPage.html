<!doctype html>
<html>
    <head>
        <title>Simple colorful webpage</title>
    </head>

    <body bgcolor="lightblue">
        <h1 align="center">
            <font color="darkblue">Welcome to my webpage!</font>
        </h1>

        <h2 color="red"></h2>

        <p align="center">
            <font color="green" size="5">
                This is a simple webpage using HTML.
            </font>
        </p>

        <h2>
            <font color="purple">My favorite fruits</font>
        </h2>

        <ul>
            <li><font color="red">Apple</font></li>
            <li><font color="orange">Orange</font></li>
            <li><font color="green">Grapes</font></li>
            <li><font color="blue">Blueberries</font></li>
        </ul>

        <h2>
            <font color="brown">My hobbies</font>
        </h2>

        <ol>
            <li>Reading</li>
            <li>Gaming</li>
            <li>Drawing</li>
        </ol>

        <p align="center">
            <button onclick="alert('')">click me</button>
        </p>

        <hr />

        <h2 color="red">
            <marquee behavior="scroll" direction="left">
                <font color="red"> Thank you for visiting my webpage! </font>
            </marquee>
        </h2>
    </body>
</html>
