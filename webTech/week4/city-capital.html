<!doctype html>
<html>
    <head>
        <title>WT Lab Manual Program No. 3</title>

        <style>
            h1 {
                color: red;
                text-align: center;
            }

            .textbox1 {
                color: blue;
                font-size: 30px;
                font-weight: bold;
            }
        </style>
    </head>

    <body>
        <center>
            <h1>Select the country name to find its capital</h1>

            <form name="myform">
                Select Country

                <select
                    name="country"
                    id="sbox1"
                    onchange="myFunction()"
                    required
                >
                    <option value="">--Select--</option>

                    <option value="NEW DELHI">INDIA</option>

                    <option value="CANBERRA">AUSTRALIA</option>

                    <option value="WASHINGTON D.C">AMERICA</option>

                    <option value="LONDON">UNITED KINGDOM</option>

                    <option value="BERLIN">GERMANY</option>
                </select>

                <br /><br />

                Capital

                <input type="text" class="textbox1" id="sbox2" />
            </form>
        </center>

        <script>
            function myFunction() {
                var a = document.getElementById("sbox1").value;

                document.getElementById("sbox2").value = a;
            }
        </script>
    </body>
</html>
